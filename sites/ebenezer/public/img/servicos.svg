<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" width="900" height="700" role="img">
  <title>Arte dos serviços</title>

  <defs>
    <linearGradient id="campo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c66a0" />
      <stop offset="0.6" stop-color="#17527f" />
      <stop offset="1" stop-color="#0f3859" />
    </linearGradient>

    <radialGradient id="luz" cx="0.25" cy="0.2" r="0.7">
      <stop offset="0" stop-color="#4d9bd6" stop-opacity="0.5" />
      <stop offset="1" stop-color="#4d9bd6" stop-opacity="0" />
    </radialGradient>

    <pattern id="pontos" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#ffffff" fill-opacity="0.07" />
    </pattern>
  </defs>

  <rect width="900" height="700" fill="url(#campo)" />
  <rect width="900" height="700" fill="url(#pontos)" />
  <rect width="900" height="700" fill="url(#luz)" />

  <!--
    Os cinco serviços, no mesmo traço do set de ícones da interface.
    Composição em duas fileiras, com o principal maior.
  -->
  <g fill="none" stroke="#ffffff" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round">
    <!-- controle de pragas — maior, canto superior esquerdo -->
    <g transform="translate(78 96) scale(9)" stroke-opacity="0.5">
      <path d="M9.4 6.3 6.5 3M14.6 6.3 17.5 3" />
      <rect x="8" y="6" width="8" height="14" rx="4" />
      <path d="M8 10.5H4M8 15H4M16 10.5h4M16 15h4" />
    </g>

    <!-- desentupimento -->
    <g transform="translate(470 130) scale(6.4)" stroke-opacity="0.36">
      <path d="M3 7h6a5 5 0 0 1 5 5v4" />
      <path d="M2 5h3v4H2z" />
      <path d="M11 15.5l3 3.5 3-3.5" />
    </g>

    <!-- caixa d'água -->
    <g transform="translate(690 350) scale(5.6)" stroke-opacity="0.3">
      <path d="M12 3c0 0 6 6.4 6 10.4a6 6 0 0 1-12 0C6 9.4 12 3 12 3Z" />
      <path d="M9.5 13.5a2.5 2.5 0 0 0 2.5 2.5" />
    </g>

    <!-- fossa / caixa de gordura -->
    <g transform="translate(300 400) scale(6.8)" stroke-opacity="0.34">
      <ellipse cx="12" cy="6" rx="7" ry="3" />
      <path d="M5 6v12c0 1.7 3.1 3 7 3s7-1.3 7-3V6" />
      <path d="M5 12c0 1.7 3.1 3 7 3s7-1.3 7-3" />
    </g>

  </g>
</svg>
