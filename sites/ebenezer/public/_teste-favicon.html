<!doctype html>
<meta charset="utf-8">
<style>
  body { font: 13px system-ui; margin: 0; display: grid; grid-template-columns: 1fr 1fr; }
  .painel { padding: 28px; display: grid; gap: 22px; justify-items: start; }
  .claro { background: #f1f3f4; color: #202124; }
  .escuro { background: #202124; color: #e8eaed; }
  .linha { display: flex; align-items: flex-end; gap: 18px; }
  .rot { opacity: .6; font-size: 11px; }
  img { image-rendering: auto; }
  .aba { display:flex; align-items:center; gap:7px; padding:7px 12px; border-radius:8px 8px 0 0; font-size:12px; }
  .claro .aba { background:#fff; }
  .escuro .aba { background:#35363a; }
</style>
<div class="painel claro">
  <div class="rot">chrome claro</div>
  <div class="linha">
    <img src="/favicon.svg" width="16" height="16">
    <img src="/favicon.svg" width="24" height="24">
    <img src="/favicon.svg" width="32" height="32">
    <img src="/favicon.svg" width="64" height="64">
    <img src="/favicon.svg" width="128" height="128">
  </div>
  <div class="aba"><img src="/favicon.svg" width="16" height="16"> Ebenézer — Dedetização em Betim</div>
</div>
<div class="painel escuro">
  <div class="rot">chrome escuro</div>
  <div class="linha">
    <img src="/favicon.svg" width="16" height="16">
    <img src="/favicon.svg" width="24" height="24">
    <img src="/favicon.svg" width="32" height="32">
    <img src="/favicon.svg" width="64" height="64">
    <img src="/favicon.svg" width="128" height="128">
  </div>
  <div class="aba"><img src="/favicon.svg" width="16" height="16"> Ebenézer — Dedetização em Betim</div>
</div>
