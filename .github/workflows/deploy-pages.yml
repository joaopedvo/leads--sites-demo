name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sites/*/package-lock.json

      # Descobre os demos pelo sistema de arquivos: criar uma pasta em sites/
      # basta para o demo entrar no ar. Nada aqui precisa ser editado.
      - name: Build de cada demo
        run: |
          set -euo pipefail
          mkdir -p dist
          for dir in sites/*/; do
            slug=$(basename "$dir")
            echo "::group::build $slug"
            (cd "$dir" && npm ci && npm run build)
            mkdir -p "dist/$slug"
            cp -r "$dir"dist/. "dist/$slug/"
            echo "::endgroup::"
          done

      - name: Gerar índice da galeria
        run: node scripts/gerar-indice.mjs

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
